[package]
name = "aa-core"
description = "The shared Rust core of aa-finance (ADR-0008)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[features]
# Test support: the raw connection and `tamper`, so tests can break rules on purpose.
test-support = []

[dev-dependencies]
aa-core = { path = ".", features = ["test-support"] }
