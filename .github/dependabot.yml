version: 2
# Monthly while the project is in fast development: every Dependabot run uses Actions minutes in a private
# repository. Security updates are not affected by this schedule.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
