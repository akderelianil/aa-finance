name: CI

# While the project changes every day, CI runs on code changes only, and only on Ubuntu. The three-system
# matrix (Ubuntu, Windows, macOS) is started by hand: Actions -> CI -> Run workflow, or
# `gh workflow run ci.yml`. This stays so after the repository is public, until the product has matured
# (owner decision of 2026-10-14; see docs/foundation/ci.md).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.stories/**'
      - '.claude/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.stories/**'
      - '.claude/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-scripts:
    name: Repo scripts and test catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test
      - run: npm run test:catalog:check

  rust-core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu on every code push; all three systems when started by hand.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
